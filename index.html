<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Encrypt and decrypt files with age, entirely in your browser."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>aged — age encryption in your browser</title>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      try {
        const theme = localStorage.getItem("aged-theme");
        if (
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
